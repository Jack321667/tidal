# Codemagic CI config — builds & ships Tidal (Capacitor) to TestFlight/App Store
# WITHOUT needing a Mac on your end.
#
# SETUP (one time): add your App Store Connect API key as a secure variable
# group named "appstore" in Codemagic (see the steps your assistant gave you):
#   APP_STORE_CONNECT_ISSUER_ID       = the Issuer ID (a UUID)
#   APP_STORE_CONNECT_KEY_IDENTIFIER  = the Key ID (~10 chars)
#   APP_STORE_CONNECT_PRIVATE_KEY     = the FULL contents of the .p8 file
#                                       (including the BEGIN/END lines)
#   CERTIFICATE_PRIVATE_KEY           = the full contents of cert_private_key.pem
#                                       (generated locally; reused every build)
# Mark them all "Secure". Then set BUNDLE_ID below to match capacitor.config.json.
# NOTE: the App Store Connect API key must have ADMIN access to create the
# distribution certificate & provisioning profile.

workflows:
  ios-tidal:
    name: Tidal iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore          # the variable group you create in the Codemagic UI
      vars:
        BUNDLE_ID: "com.mschaefer20.tidal"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22            # Capacitor 8 CLI requires Node >=22
      xcode: latest       # Capacitor 8 needs Xcode 16.4+ (latest resolves 26.x)
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform (if not committed)
        script: |
          # Capacitor 8 defaults to Swift Package Manager, which produces no
          # Podfile and no App.xcworkspace — breaking both `pod install` and
          # `build-ipa --workspace` below. Force CocoaPods to keep the existing
          # pipeline (and the ci/*.js pbxproj patches) working.
          if [ ! -d "ios" ]; then npx cap add ios --packagemanager CocoaPods; fi
      - name: Sync web assets + plugins into the native project
        script: npx cap sync ios
      - name: Make the app iPhone-only (no iPad)
        script: node ci/iphone-only.js
      - name: Enable Game Center capability
        script: node ci/enable-gamecenter.js
      - name: Configure Info.plist (compliance + portrait lock)
        script: |
          PLIST=ios/App/App/Info.plist
          # Marketing version (1.0 train is closed — ship as 1.1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.1" "$PLIST"
          # Encryption compliance (no custom encryption)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Portrait only (applies to iPhone and iPad)
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          # Remove any iPad-specific orientation list and opt out of iPad
          # multitasking so portrait-only is allowed (Apple validation 90474).
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST"
      - name: Configure audio session (play through the mute switch)
        script: node ci/configure-audio.js
      - name: Generate app icon & splash
        script: npx capacitor-assets generate --ios || true
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Fetch signing files & set up keychain (uses the API key)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number (Codemagic's monotonic build counter)
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload only. The build is then available to INTERNAL TestFlight testers
        # immediately (no beta review). To enable EXTERNAL testers, fill in the
        # TestFlight test info in App Store Connect, then set this to true.
        submit_to_testflight: false
        # submit_to_app_store: false   # flip to true once you're ready to release

  # ---------------------------------------------------------------------------
  # ANDROID — builds the same web app (webDir: tidal) into a signed .aab.
  # Like iOS, the android/ project is NOT committed: it is generated fresh by
  # `npx cap add android` and re-patched by the ci/android-*.js scripts. Start
  # this from the Codemagic UI (no auto-trigger), same as the iOS workflow.
  #
  # ONE-TIME SETUP in the Codemagic UI before the first run:
  #   - Variable group "googleplay" with GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
  #     (the Play service-account JSON — see RevenueCat/Play setup).
  #   - Android keystore uploaded under the reference name "tidal_keystore"
  #     (Codemagic exposes it to Gradle as CM_KEYSTORE_PATH / _PASSWORD /
  #     CM_KEY_ALIAS / CM_KEY_PASSWORD, which ci/android-signing.js reads).
  # NOTE: the FIRST .aab cannot be published via API — upload it once by hand in
  # the Play Console, then this google_play block works for subsequent builds.
  android-tidal:
    name: Tidal Android
    instance_type: mac_mini_m2      # Codemagic's free minutes are macOS-only;
                                    # switch to linux_x2 if paying per-minute.
    max_build_duration: 60
    environment:
      groups:
        - googleplay
      android_signing:
        - tidal_keystore
      vars:
        BUNDLE_ID: "com.mschaefer20.tidal"
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add Android platform (if not committed)
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
      - name: Sync web assets + plugins into the native project
        script: npx cap sync android
      - name: Set Android applicationId (Play package name, differs from iOS)
        script: node ci/android-appid.js
      - name: Stamp versionCode (= build number) + versionName (= package.json)
        script: node ci/android-version.js
      - name: Lock portrait orientation (+ large-screen compat)
        script: node ci/android-manifest.js
      - name: Inject release signing config
        script: node ci/android-signing.js
      - name: Generate app icon & splash
        script: npx capacitor-assets generate --android || true
      - name: Assert an adaptive icon was generated (capacitor-assets fails open)
        script: test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build signed release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Draft/held so a stray build never auto-goes-live to testers.
        submit_as_draft: true
